<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .card {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 40px 30px;
        border-radius: 20px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        text-align: center;
        width: 90%;
        max-width: 360px;
    }
    h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 24px; color: #e2e8f0; }
    
    /* Dynamic Neon Ring Spinner */
    .spinner-ring {
        position: relative;
        width: 64px;
        height: 64px;
        margin: 0 auto 24px auto;
    }
    .spinner-ring div {
        box-sizing: border-box;
        display: block;
        position: absolute;
        width: 64px;
        height: 64px;
        border: 5px solid transparent;
        border-radius: 50%;
        animation: ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        border-color: #38bdf8 transparent transparent transparent;
    }
    .spinner-ring div:nth-child(1) { animation-delay: -0.45s; }
    .spinner-ring div:nth-child(2) { animation-delay: -0.3s; }
    .spinner-ring div:nth-child(3) { animation-delay: -0.15s; }
    @keyframes ring {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    p { font-size: 0.9rem; color: #94a3b8; }
</style>

<div class="card">
    <div class="spinner-ring" id="loader">
        <div></div><div></div><div></div><div></div>
    </div>
    <h2 id="status">Đang chuyển hướng...</h2>
    <p id="message">Vui lòng chờ trong giây lát.</p>
</div>
