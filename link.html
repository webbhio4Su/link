<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Load</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      color: #fff;
    }
    .spinner {
      width: 56px;
      height: 56px;
      animation: rotate 2s linear infinite;
    }
    .path {
      stroke: #fff;
      stroke-width: 4;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 1, 200;
      animation: dash 1.5s ease-in-out infinite;
    }
    .error-msg {
      display: none;
      margin-top: 20px;
      font-size: 14px;
      color: #ff4d4d;
      text-align: center;
      padding: 0 20px;
    }
    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }
    @keyframes dash {
      0% {
        stroke-dasharray: 1, 200;
        stroke-dashoffset: 0;
      }
      50% {
        stroke-dasharray: 89, 200;
        stroke-dashoffset: -35px;
      }
      100% {
        stroke-dasharray: 89, 200;
        stroke-dashoffset: -124px;
      }
    }
  </style>
</head>
<body>

  <!-- Spinner Vòng Xoay SVG -->
  <svg class="spinner" id="loader" viewBox="25 25 50 50">
    <circle class="path" cx="50" cy="50" r="20"></circle>
  </svg>

  <!-- Thông báo lỗi nếu không có link -->
  <p class="error-msg" id="errorMsg">Không tìm thấy đường dẫn chuyển hướng!</p>

  <script>
    // Hiệu ứng đổi tiêu đề "Load", "Load.", "Load..", "Load..."
    let dots = 0;
    const titleInterval = setInterval(() => {
      dots = (dots + 1) % 4;
      document.title = "Load" + ".".repeat(dots);
    }, 500);

    // Logic lấy URL và chuyển hướng
    const urlParams = new URLSearchParams(window.location.search);
    const targetUrl = urlParams.get('to');

    if (targetUrl) {
      let finalUrl = targetUrl;
      if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
        finalUrl = 'https://' + targetUrl;
      }

      // Chuyển hướng sau 800ms
      setTimeout(() => {
        window.location.href = finalUrl;
      }, 800);
    } else {
      // Nếu thiếu tham số ?to= thì dừng spinner và hiện thông báo
      clearInterval(titleInterval);
      document.title = "Lỗi đường dẫn";
      document.getElementById('loader').style.display = 'none';
      document.getElementById('errorMsg').style.display = 'block';
    }
  </script>

</body>
</html>
