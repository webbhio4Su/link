<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang mở link...</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      font-family: Arial, sans-serif;
    }

    .loading {
      text-align: center;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #e8e8e8;
      border-top-color: #111;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 18px;
    }

    .text {
      color: #555;
      font-size: 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="loading">
    <div class="spinner"></div>
    <div class="text">Đang mở link...</div>
  </div>

  <script>
    const WORKER = "https://world.sftcdpcute.workers.dev";

    const path = window.location.pathname;

    const match = path.match(
      /\/link\/links\/open\/([^/]+)\/?$/
    );

    if (match) {
      const id = match[1];

      setTimeout(() => {
        window.location.replace(
          WORKER + "/" + encodeURIComponent(id)
        );
      }, 1000);
    }
  </script>

</body>
</html>
