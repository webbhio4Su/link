<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkShort - Rút gọn liên kết</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: #f6f7f9;
      color: #171717;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
      font-size: 15px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,.07);
      border: 1px solid #eee;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 9px;
      font-size: 14px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      height: 50px;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 0 15px;
      font-size: 15px;
      outline: none;
      transition: .2s;
    }

    input:focus {
      border-color: #111;
      box-shadow: 0 0 0 3px rgba(0,0,0,.06);
    }

    button {
      border: 0;
      cursor: pointer;
      font-weight: 600;
      transition: .2s;
    }

    .shorten-btn {
      height: 50px;
      padding: 0 22px;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 15px;
      white-space: nowrap;
    }

    .shorten-btn:hover {
      background: #333;
      transform: translateY(-1px);
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      background: #f5f5f5;
    }

    .result-title {
      font-size: 13px;
      color: #777;
      margin-bottom: 8px;
    }

    .result-row {
      display: flex;
      gap: 8px;
    }

    .short-link {
      flex: 1;
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .copy-btn,
    .open-btn {
      padding: 0 15px;
      border-radius: 10px;
      background: white;
      border: 1px solid #ddd;
    }

    .copy-btn:hover,
    .open-btn:hover {
      background: #eee;
    }

    .history {
      margin-top: 25px;
    }

    .history-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      padding: 13px;
      border: 1px solid #eee;
      border-radius: 12px;
      background: #fafafa;
    }

    .history-short {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
      word-break: break-all;
    }

    .history-original {
      color: #888;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty {
      color: #999;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }

    .error {
      display: none;
      color: #d00;
      margin-top: 10px;
      font-size: 13px;
    }

    .footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-top: 20px;
    }

    @media (max-width: 550px) {
      .input-row {
        flex-direction: column;
      }

      .shorten-btn {
        width: 100%;
      }

      .result-row {
        flex-wrap: wrap;
      }

      .short-link {
        flex-basis: 100%;
      }

      .copy-btn,
      .open-btn {
        height: 42px;
        flex: 1;
      }

      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">LinkShort</div>

    <div class="subtitle">
      Rút gọn liên kết nhanh chóng
    </div>

    <div class="card">

      <label for="urlInput">Liên kết cần rút gọn</label>

      <div class="input-row">
        <input
          id="urlInput"
          type="url"
          placeholder="https://example.com/duong-dan-rat-dai..."
          autocomplete="off"
        >

        <button class="shorten-btn" onclick="shortenLink()">
          Rút gọn
        </button>
      </div>

      <div class="error" id="error">
        Vui lòng nhập một URL hợp lệ.
      </div>

      <div class="result" id="result">

        <div class="result-title">
          Link ngắn của bạn
        </div>

        <div class="result-row">

          <div class="short-link" id="shortLink"></div>

          <button class="copy-btn" onclick="copyLink()">
            Copy
          </button>

          <button class="open-btn" onclick="openLink()">
            Mở
          </button>

        </div>

      </div>

      <div class="history">

        <div class="history-title">
          Lịch sử
        </div>

        <div class="history-list" id="historyList"></div>

      </div>

    </div>

    <div class="footer">
      LinkShort • URL Shortener
    </div>

  </div>

<script>

  const STORAGE_KEY = "linkshort_data";

  let currentShortLink = "";
  let currentOriginalLink = "";

  function generateCode(length = 7) {

    const chars =
      "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

    let code = "";

    for (let i = 0; i < length; i++) {
      code += chars[Math.floor(Math.random() * chars.length)];
    }

    return code;
  }

  function getData() {

    try {
      return JSON.parse(
        localStorage.getItem(STORAGE_KEY)
      ) || {};
    } catch {
      return {};
    }

  }

  function saveData(data) {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

  }

  function shortenLink() {

    const input =
      document.getElementById("urlInput");

    const error =
      document.getElementById("error");

    const result =
      document.getElementById("result");

    const url = input.value.trim();

    error.style.display = "none";

    if (!url) {

      error.textContent =
        "Vui lòng nhập liên kết.";

      error.style.display = "block";

      return;
    }

    let parsedUrl;

    try {

      parsedUrl = new URL(url);

    } catch {

      error.textContent =
        "Liên kết không hợp lệ.";

      error.style.display = "block";

      return;
    }

    if (
      parsedUrl.protocol !== "http:" &&
      parsedUrl.protocol !== "https:"
    ) {

      error.textContent =
        "Chỉ hỗ trợ liên kết HTTP hoặc HTTPS.";

      error.style.display = "block";

      return;
    }

    const data = getData();

    let code;

    do {

      code = generateCode(7);

    } while (data[code]);

    const baseUrl =
      window.location.origin +
      window.location.pathname;

    const shortUrl =
      baseUrl +
      "?s=" +
      code;

    data[code] = {
      url: url,
      created: Date.now()
    };

    saveData(data);

    currentShortLink = shortUrl;
    currentOriginalLink = url;

    document.getElementById("shortLink")
      .textContent = shortUrl;

    result.style.display = "block";

    input.value = "";

    renderHistory();

  }

  function copyLink() {

    if (!currentShortLink) return;

    navigator.clipboard.writeText(
      currentShortLink
    ).then(() => {

      const btn =
        document.querySelector(".copy-btn");

      const oldText = btn.textContent;

      btn.textContent = "Đã copy ✓";

      setTimeout(() => {
        btn.textContent = oldText;
      }, 1500);

    });

  }

  function openLink() {

    if (!currentOriginalLink) return;

    window.open(
      currentOriginalLink,
      "_blank"
    );

  }

  function renderHistory() {

    const list =
      document.getElementById("historyList");

    const data = getData();

    const entries =
      Object.entries(data)
        .sort((a, b) =>
          b[1].created - a[1].created
        )
        .slice(0, 10);

    if (!entries.length) {

      list.innerHTML =
        '<div class="empty">Chưa có link nào</div>';

      return;
    }

    list.innerHTML = "";

    entries.forEach(([code, item]) => {

      const div =
        document.createElement("div");

      div.className = "history-item";

      const shortUrl =
        window.location.origin +
        window.location.pathname +
        "?s=" +
        code;

      div.innerHTML = `
        <div class="history-short">
          ${escapeHtml(shortUrl)}
        </div>

        <div class="history-original">
          ${escapeHtml(item.url)}
        </div>
      `;

      list.appendChild(div);

    });

  }

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }

  function checkRedirect() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const code =
      params.get("s");

    if (!code) return;

    const data = getData();

    const item = data[code];

    if (!item) return;

    window.location.replace(item.url);

  }

  document
    .getElementById("urlInput")
    .addEventListener("keydown", function(e) {

      if (e.key === "Enter") {
        shortenLink();
      }

    });

  checkRedirect();
  renderHistory();

</script>

</body>
</html>
