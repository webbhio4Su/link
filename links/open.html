<!DOCTYPE html>
<html lang="vi">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Đang mở link...</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {

      background: #ffffff;

      color: #111111;

      font-family:
        Arial,
        sans-serif;

      display: flex;

      justify-content: center;

      align-items: center;

      overflow: hidden;

    }

    .loading {

      text-align: center;

      animation:
        fadeIn .3s ease;

    }

    .spinner {

      width: 42px;

      height: 42px;

      border: 4px solid #e8e8e8;

      border-top-color: #111111;

      border-radius: 50%;

      animation:
        spin .8s linear infinite;

      margin:
        0 auto 20px;

    }

    .text {

      font-size: 15px;

      color: #555;

    }

    @keyframes spin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }

    @keyframes fadeIn {

      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }

    }

  </style>

</head>

<body>

  <div class="loading">

    <div class="spinner"></div>

    <div class="text">
      Đang mở link...
    </div>

  </div>

<script>

const WORKER_URL =
  "https://world.sftcdpcute.workers.dev";

const prefix =
  "/link/links/open/";

const path =
  window.location.pathname;

if (path.startsWith(prefix)) {

  const id =
    path.slice(prefix.length)
      .split("/")[0];

  if (id) {

    /*
     * Hiện loading trước
     * rồi chuyển sang Worker.
     */

    setTimeout(() => {

      window.location.replace(
        `${WORKER_URL}/${encodeURIComponent(id)}`
      );

    }, 1000);

  }

} else {

  /*
   * Nếu không phải route open
   * thì quay về trang chính.
   */

  setTimeout(() => {

    window.location.replace(
      "/"
    );

  }, 500);

}

</script>

</body>
</html>
