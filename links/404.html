<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Đang mở link...</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: #fff;
      color: #111;
      font-family: Arial, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading {
      text-align: center;
    }

    .spinner {
      width: 42px;
      height: 42px;

      border: 4px solid #e8e8e8;
      border-top-color: #111;

      border-radius: 50%;

      animation: spin .8s linear infinite;

      margin: 0 auto 18px;
    }

    .text {
      font-size: 15px;
      color: #555;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="loading">

    <div class="spinner"></div>

    <div class="text">
      Đang mở link...
    </div>

  </div>

<script>
(function () {

  const WORKER =
    "https://world.sftcdpcute.workers.dev";

  const OPEN_PATH =
    "/link/links/open/";

  const currentPath =
    window.location.pathname;

  /*
   * Ví dụ:
   *
   * /link/links/open/ub2KYEp
   *
   * lấy ra:
   *
   * ub2KYEp
   */

  if (
    currentPath.startsWith(OPEN_PATH)
  ) {

    const id =
      currentPath
        .substring(OPEN_PATH.length)
        .split("/")[0];

    if (id) {

      setTimeout(function () {

        window.location.href =
          WORKER +
          "/" +
          encodeURIComponent(id);

      }, 1000);

      return;
    }
  }

  /*
   * Không phải link open
   */

  setTimeout(function () {

    window.location.href = "/";

  }, 500);

})();
</script>

</body>
</html>
