<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Shortener</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 600px;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    .input:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #f1f1f1;
      border-radius: 12px;
      word-break: break-all;
    }

    .result a {
      color: #111;
      font-weight: bold;
    }

    .copy {
      background: #333;
    }

    .error {
      color: #d00;
      margin-top: 15px;
      text-align: center;
    }

    .loading {
      text-align: center;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🔗 Link Shortener</h1>

    <input
      id="urlInput"
      class="input"
      type="url"
      placeholder="Nhập URL cần rút gọn..."
      autocomplete="off"
    >

    <button id="shortenBtn">
      Rút gọn link
    </button>

    <div id="loading" class="loading">
      Đang tạo link...
    </div>

    <div id="error" class="error"></div>

    <div id="result" class="result">
      <div>Link rút gọn:</div>
      <br>

      <a
        id="shortUrl"
        href="#"
        target="_blank"
        rel="noopener"
      ></a>

      <button id="copyBtn" class="copy">
        Sao chép
      </button>
    </div>

  </div>

<script>
  // ==================================================
  // URL CLOUDFLARE WORKER CỦA MÀY
  // ==================================================

  const API_URL =
    "https://world.sftcdpcute.workers.dev";


  // ==================================================
  // ELEMENTS
  // ==================================================

  const urlInput =
    document.getElementById("urlInput");

  const shortenBtn =
    document.getElementById("shortenBtn");

  const copyBtn =
    document.getElementById("copyBtn");

  const result =
    document.getElementById("result");

  const shortUrl =
    document.getElementById("shortUrl");

  const errorBox =
    document.getElementById("error");

  const loading =
    document.getElementById("loading");


  // ==================================================
  // RÚT GỌN
  // ==================================================

  shortenBtn.addEventListener("click", shorten);


  urlInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      shorten();
    }
  });


  async function shorten() {

    errorBox.textContent = "";
    result.style.display = "none";

    const originalUrl =
      urlInput.value.trim();


    if (!originalUrl) {
      errorBox.textContent =
        "Hãy nhập URL.";

      return;
    }


    let parsed;

    try {
      parsed =
        new URL(originalUrl);
    } catch {
      errorBox.textContent =
        "URL không hợp lệ.";

      return;
    }


    if (
      parsed.protocol !== "http:" &&
      parsed.protocol !== "https:"
    ) {
      errorBox.textContent =
        "Chỉ hỗ trợ HTTP và HTTPS.";

      return;
    }


    shortenBtn.disabled = true;
    loading.style.display = "block";


    try {

      const response =
        await fetch(
          API_URL + "/api/shorten",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              url: originalUrl
            })
          }
        );


      const text =
        await response.text();


      let data;

      try {
        data =
          JSON.parse(text);
      } catch {
        throw new Error(
          "Worker không trả JSON. Kiểm tra URL Worker."
        );
      }


      if (!response.ok || !data.success) {
        throw new Error(
          data.error ||
          "Không thể tạo link."
        );
      }


      shortUrl.textContent =
        data.shortUrl;

      shortUrl.href =
        data.shortUrl;

      result.style.display =
        "block";


    } catch (error) {

      console.error(error);

      errorBox.textContent =
        error.message ||
        "Failed to fetch.";

    } finally {

      shortenBtn.disabled =
        false;

      loading.style.display =
        "none";
    }
  }


  // ==================================================
  // COPY
  // ==================================================

  copyBtn.addEventListener(
    "click",
    async function() {

      const text =
        shortUrl.textContent;

      try {

        await navigator.clipboard
          .writeText(text);

        copyBtn.textContent =
          "Đã sao chép ✓";

        setTimeout(() => {
          copyBtn.textContent =
            "Sao chép";
        }, 1500);

      } catch {

        alert(
          "Không thể sao chép."
        );

      }
    }
  );
</script>

</body>
</html>
