<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Link Shortener</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: min(92%, 520px);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .subtitle {
      margin: 0 0 30px;
      color: #666;
    }

    .box {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      height: 48px;
      padding: 0 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #111;
    }

    button {
      height: 48px;
      padding: 0 20px;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .result {
      margin-top: 25px;
      padding: 18px;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      display: none;
      text-align: left;
    }

    .result-title {
      font-size: 13px;
      color: #777;
      margin-bottom: 8px;
    }

    .short-link {
      word-break: break-all;
      font-size: 15px;
      margin-bottom: 14px;
    }

    .copy {
      width: 100%;
    }

    .error {
      margin-top: 15px;
      color: #d00;
      font-size: 14px;
      display: none;
    }

    @media (max-width: 500px) {
      .box {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>Link Shortener</h1>

    <p class="subtitle">
      Tạo link ngắn nhanh chóng
    </p>

    <div class="box">

      <input
        id="urlInput"
        type="url"
        placeholder="https://example.com"
        autocomplete="off"
      >

      <button id="shortenBtn">
        Rút gọn
      </button>

    </div>

    <div id="error" class="error"></div>

    <div id="result" class="result">

      <div class="result-title">
        Link rút gọn
      </div>

      <div
        id="shortLink"
        class="short-link"
      ></div>

      <button
        id="copyBtn"
        class="copy"
      >
        Sao chép
      </button>

    </div>

  </main>

<script>

const API_URL =
  "https://world.sftcdpcute.workers.dev";

const urlInput =
  document.getElementById("urlInput");

const shortenBtn =
  document.getElementById("shortenBtn");

const copyBtn =
  document.getElementById("copyBtn");

const result =
  document.getElementById("result");

const shortLink =
  document.getElementById("shortLink");

const errorBox =
  document.getElementById("error");


function showError(message) {

  errorBox.textContent = message;

  errorBox.style.display = "block";

}


function hideError() {

  errorBox.style.display = "none";

}


shortenBtn.addEventListener(
  "click",
  async () => {

    hideError();

    result.style.display = "none";

    const originalUrl =
      urlInput.value.trim();

    if (!originalUrl) {

      showError("Vui lòng nhập URL.");

      return;

    }

    let parsed;

    try {

      parsed =
        new URL(originalUrl);

    } catch {

      showError("URL không hợp lệ.");

      return;

    }

    if (
      parsed.protocol !== "http:" &&
      parsed.protocol !== "https:"
    ) {

      showError(
        "Chỉ hỗ trợ HTTP và HTTPS."
      );

      return;

    }

    shortenBtn.disabled = true;

    shortenBtn.textContent =
      "Đang tạo...";

    try {

      const response =
        await fetch(
          API_URL + "/api/shorten",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                url: originalUrl
              })
          }
        );

      const data =
        await response.json();

      if (
        !response.ok ||
        !data.success
      ) {

        throw new Error(
          data.error ||
          "Không thể tạo link."
        );

      }

      /*
       * Link người dùng nhìn thấy
       *
       * https://webbhio4su.github.io/link/links/open/ID
       */

      const publicUrl =
        `${window.location.origin}/link/links/open/${encodeURIComponent(data.code)}`;

      shortLink.textContent =
        publicUrl;

      result.style.display =
        "block";

    } catch (error) {

      showError(
        error.message ||
        "Có lỗi xảy ra."
      );

    } finally {

      shortenBtn.disabled = false;

      shortenBtn.textContent =
        "Rút gọn";

    }

  }
);


copyBtn.addEventListener(
  "click",
  async () => {

    const text =
      shortLink.textContent;

    if (!text) return;

    try {

      await navigator.clipboard.writeText(
        text
      );

      copyBtn.textContent =
        "Đã sao chép ✓";

      setTimeout(() => {

        copyBtn.textContent =
          "Sao chép";

      }, 1500);

    } catch {

      showError(
        "Không thể sao chép."
      );

    }

  }
);

</script>

</body>
</html>
