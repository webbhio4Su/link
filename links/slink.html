<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Shortener</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .container {
      width: min(600px, 92%);
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 25px;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #000;
    }

    button {
      width: 100%;
      height: 50px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      background: #000;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    #result {
      margin-top: 20px;
      word-break: break-all;
    }

    #result a {
      color: #06c;
    }

    .error {
      color: #d00;
    }

    .success {
      padding: 15px;
      background: #f5f5f5;
      border-radius: 12px;
    }

    .copy {
      margin-top: 10px;
      background: #222;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🔗 Rút gọn link</h1>

    <input
      id="urlInput"
      type="url"
      placeholder="Dán link dài vào đây..."
      autocomplete="off"
    >

    <button id="shortenButton">
      Rút gọn link
    </button>

    <div id="result"></div>

  </div>

<script>
  /*
    QUAN TRỌNG:
    Đổi URL này thành URL Cloudflare Worker của mày.
  */

  const API_URL =
    "https://TEN-WORKER-CUA-MAY.workers.dev";

  const input =
    document.getElementById("urlInput");

  const button =
    document.getElementById("shortenButton");

  const result =
    document.getElementById("result");


  button.addEventListener("click", shorten);


  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      shorten();
    }
  });


  async function shorten() {

    const originalUrl =
      input.value.trim();

    result.innerHTML = "";


    if (!originalUrl) {
      result.innerHTML =
        '<p class="error">Hãy nhập link.</p>';

      return;
    }


    try {

      new URL(originalUrl);

    } catch {

      result.innerHTML =
        '<p class="error">Link không hợp lệ.</p>';

      return;
    }


    button.disabled = true;
    button.textContent = "Đang tạo...";

    result.textContent =
      "Đang kết nối máy chủ...";


    try {

      const response = await fetch(
        API_URL + "/api/shorten",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            url: originalUrl
          })
        }
      );


      /*
        Đọc text trước để tránh lỗi:
        Unexpected token '<'
      */

      const text =
        await response.text();


      console.log(
        "HTTP:",
        response.status
      );

      console.log(
        "SERVER:",
        text
      );


      let data;


      try {

        data =
          JSON.parse(text);

      } catch {

        throw new Error(
          "Máy chủ đang trả HTML thay vì JSON. Kiểm tra API_URL."
        );

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Không thể tạo link."
        );

      }


      result.innerHTML = `
        <div class="success">

          <strong>Link ngắn:</strong>

          <br><br>

          <a
            href="${escapeHtml(data.shortUrl)}"
            target="_blank"
            rel="noopener"
          >
            ${escapeHtml(data.shortUrl)}
          </a>

          <button
            class="copy"
            onclick="copyLink('${escapeJs(data.shortUrl)}')"
          >
            Sao chép
          </button>

        </div>
      `;


    } catch (error) {

      console.error(error);

      result.innerHTML =
        '<p class="error">' +
        escapeHtml(error.message) +
        '</p>';

    }


    button.disabled = false;
    button.textContent =
      "Rút gọn link";
  }


  async function copyLink(link) {

    try {

      await navigator.clipboard.writeText(link);

      alert("Đã sao chép link!");

    } catch {

      prompt(
        "Sao chép link:",
        link
      );

    }
  }


  function escapeHtml(text) {

    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function escapeJs(text) {

    return String(text)
      .replaceAll("\\", "\\\\")
      .replaceAll("'", "\\'");

  }
</script>

</body>
</html>
